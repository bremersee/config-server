spring:
  application:
    name: config-server
  profiles:
    active: in-memory

  cloud:
    config:
      server:
        git:
          uri: ${GIT_URI:https://github.com/bremersee/config}
          default-label: ${GIT_DEFAULT_LABEL:develop}
          basedir: ${DATA_DIR:${java.io.tmpdir}}/git

encrypt:
  key-store:
    location: ${ENCRYPTION_KEYSTORE_LOCATION:classpath:/encryption.jks}
    type: ${ENCRYPTION_KEYSTORE_TYPE:jks}
    password: ${ENCRYPTION_KEYSTORE_PASSWORD:changeit}
    alias: ${ENCRYPTION_KEYSTORE_ALIAS:encryption}
    secret: ${ENCRYPTION_KEYSTORE_SECRET:changeit}

logging:
  level:
    org.springframework: INFO
    org.bremersee: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: when_authorized

---

spring:
  config:
    activate:
      on-profile: composite

  # Example of a composite configuration
  cloud:
    config:
      server:
        fail-on-composite-error: false
        default-label: develop
        composite:
          - type: git
            uri: https://github.com/${ORGANISATION:bremersee}/{application}
            basedir: ${DATA_DIR:${java.io.tmpdir}}/git
          - type: git
            uri: https://github.com/${ORGANISATION:bremersee}/config
            basedir: ${DATA_DIR:${java.io.tmpdir}}/git/config

---

spring:
  config:
    activate:
      on-profile: in-memory

bremersee:
  authentication:
    in-memory:
      enabled: true
      users:
        - name: testadmin
          password: pass4admin
          authorities:
            - ROLE_CONFIG_SERVER_ADMIN
            - ROLE_ACTUATOR_ADMIN
        - name: testactuator
          password: pass4actuator
          authorities:
            - ROLE_ACTUATOR_ADMIN

---

spring:
  config:
    activate:
      on-profile: ldap

bremersee:
  ldaptive:
    ldap-url: ldaps://dc1.eixe.bremersee.org ldaps://dc2.eixe.bremersee.org
    ldaptive-template-class: org.bremersee.ldaptive.LdaptiveSambaTemplate
    immutable: true
    use-start-tls: false
    pooled: false
  authentication:
    ldaptive:
      template: active_directory
      user-base-dn: cn=users,dc=eixe,dc=bremersee,dc=org
      user-find-one-search-scope: subtree
      refused-usernames:
        - "Administrator"
      role-prefix: "ROLE_"
      role-case-transformation: to_upper_case
      role-string-replacements:
        - regex: "[- ]"
          replacement: "_"
        - regex: "_ADMINS"
          replacement: "_ADMIN"
      role-mapping:
        - source: "Domain Admins"
          target: "ROLE_ADMIN"
        - source: "samba-admins"
          target: "ROLE_ADMIN"

---

spring:
  config:
    activate:
      on-profile: test
  cloud:
    config:
      server:
        git:
          uri: https://github.com/bremersee/config-server
          default-label: develop
          basedir: ./git-base-dir

encrypt:
  key-store:
    location: classpath:/encryption.jks
    password: changeit
    alias: encryption
    secret: changeit

logging:
  level:
    org.springframework: INFO
    org.bremersee: DEBUG

---

spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      server:
        git:
          # this will be a local copy of the repo:
          basedir: ${GIT_BASEDIR:/opt/basedir}
          uri: ${GIT_URI:https://github.com/bremersee/config}
          default-label: ${GIT_DEFAULT_LABEL:develop}
          ignore-local-ssh-settings: ${GIT_IGNORE_LOCAL_SSH_SETTINGS:false}
          private-key: ${GIT_PRIVATE_KEY:}
          host-key: ${GIT_HOST_KEY:}
          host-key-algorithm: ${GIT_HOST_ALGORITHM:ssh-rsa}
          # known-hosts-file: ${GIT_KNOWN_HOSTS_FILE:/etc/config-server/known_hosts}

logging:
  file:
    name: ${LOG_PATH:/opt/log}/${spring.application.name:config-server}_${HOSTNAME:localhost}.log

management:
  endpoint:
    health:
      show-details: when_authorized
    logfile:
      external-file: ${logging.file.name}

server:
  tomcat:
    accesslog:
      enabled: ${ACCESS_LOG_ENABLED:true}
      directory: ${LOG_PATH:/opt/log}
      prefix: ${spring.application.name:config-server}_${HOSTNAME:unknown}_access_log

---

spring:
  config:
    activate:
      on-profile: debian

  cloud:
    config:
      server:
        git:
          basedir: /var/lib/config-server/basedir}

logging:
  level:
    ROOT: info
    org.bremersee: info
  file:
    name: /var/log/config-server/config-server.log
  logback:
    rollingpolicy:
      max-history: 25

server:
  tomcat:
    accesslog:
      enabled: false
      directory: /var/log/config-server
      prefix: access_log

management:
  endpoint:
    logfile:
      external-file: /var/log/config-server/actuator.log
